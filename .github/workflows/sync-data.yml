name: Sync public hotel data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up the data connection
        env:
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H 139.224.105.7 >> ~/.ssh/known_hosts
      - name: Build the snapshot on Aliyun
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 admin@139.224.105.7 \
            'sudo env KELI_API_BASE=http://127.0.0.1 python3 /opt/keli-pages-sync/repo/scripts/sync_data.py'
          ssh -o BatchMode=yes -o ConnectTimeout=15 admin@139.224.105.7 \
            'sudo tar -C /opt/keli-pages-sync/repo -czf - data' | tar -xzf -
      - name: Commit changed data
        run: |
          git config user.name "keli-data-bot"
          git config user.email "keli-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public hotel data"
          git push
