name: Sync public hotel data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync the three-city snapshot
        run: python3 scripts/sync_data.py
      - name: Commit changed data
        run: |
          git config user.name "keli-data-bot"
          git config user.email "keli-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public hotel data"
          git push
