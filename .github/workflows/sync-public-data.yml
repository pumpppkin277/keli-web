name: Sync public hotel data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

concurrency:
  group: keli-public-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the published site
        uses: actions/checkout@v5
        with:
          ref: github-pages

      - name: Download the server-built snapshot
        run: |
          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 300 \
            https://keli1.oss-cn-beijing.aliyuncs.com/keli-sync/snapshot.tar.gz \
            --output snapshot.tar.gz

      - name: Verify and stage the snapshot
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path("snapshot.tar.gz")
          destination = pathlib.Path("incoming")
          destination.mkdir()
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit("snapshot archive is empty")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] != "data":
                      raise SystemExit(f"unsafe snapshot path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"snapshot links are not allowed: {member.name}")
              bundle.extractall(destination, filter="data")
          PY
          python3 scripts/validate_snapshot.py incoming --previous-root .
          rsync -a --delete incoming/data/ data/

      - name: Publish changed data
        run: |
          git config user.name "keli-data-bot"
          git config user.email "keli-data-bot@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then
            echo "Public snapshot is unchanged."
            exit 0
          fi
          git commit -m "Update public hotel data"
          git push origin HEAD:github-pages
