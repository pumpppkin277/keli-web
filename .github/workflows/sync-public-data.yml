name: Sync public hotel data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

concurrency:
  group: keli-public-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the published site
        uses: actions/checkout@v5
        with:
          ref: github-pages

      - name: Build the snapshot from the public API
        run: |
          mkdir incoming
          rsync -a data/ incoming/data/
          KELI_API_BASE=http://139.224.105.7 \
          KELI_OUTPUT_ROOT=incoming \
          KELI_SYNC_DETAILS=1 \
          KELI_INCREMENTAL_DETAILS=1 \
          KELI_SYNC_WORKERS=8 \
          python3 scripts/sync_data.py

      - name: Verify and stage the snapshot
        run: |
          python3 scripts/validate_snapshot.py incoming --previous-root .
          rsync -a --delete incoming/data/ data/

      - name: Publish changed data
        run: |
          git config user.name "keli-data-bot"
          git config user.email "keli-data-bot@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then
            echo "Public snapshot is unchanged."
            exit 0
          fi
          git commit -m "Update public hotel data"
          git push origin HEAD:github-pages
